[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batvision-ai"
version = "0.1.0"
description = "BatVision AI: split-intelligence assistive navigation agent (OpenCV 5 edge + NVIDIA Nemotron on Nebius Token Factory)"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=5.0,<6",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "openai>=3.24,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4", "pyttsx3>=2.90"]
voice = ["vosk>=0.3.45", "sounddevice>=0.4"]
haptics = ["pyserial>=3.5"]
ort = ["onnxruntime>=1.18"]
data = ["pycocotools>=2.0.7", "tqdm>=4.66"]
dev = ["pytest>=8"]

[project.scripts]
batvision-edge = "batvision.edge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "latency: edge latency benchmark on real models (run with -m latency)",
    "live: calls the live model on Nebius Token Factory (run with -m live; costs money)",
]
addopts = "-m 'not latency and not live'"
